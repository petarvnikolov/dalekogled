server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    client_max_body_size 10M;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;
}
